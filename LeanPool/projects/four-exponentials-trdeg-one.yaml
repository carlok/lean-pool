main_results:
- declaration: FourExponentials.four_exponentials_trdeg_one
  informal: If λ₁₁, λ₁₂, λ₂₁, λ₂₂ are non-zero complex numbers with algebraic exponentials, λ₁₁ λ₂₂
    = λ₁₂ λ₂₁, and ℚ[λ₁₁, λ₁₂, λ₂₁, λ₂₂] has transcendence degree at most one over ℚ, then the rows
    or the columns of the matrix (λᵢⱼ) are linearly dependent over ℚ.
  source_ref: Waldschmidt 1973; Brownawell 1974
- declaration: FourExponentials.Transcendence.exp_e_or_exp_e_sq_transcendental
  informal: At least one of e^e and e^{e²} is transcendental (Schneider's eighth problem).
  source_ref: Waldschmidt 1973; Brownawell 1974
- declaration: FourExponentials.two_algebraically_independent_of_exp_column
  informal: If x₁, x₂ and y₁, y₂ are each linearly independent over ℚ and exp(x₁ y₂), exp(x₂ y₂)
    are algebraic, then two of the eight numbers xᵢ, yⱼ, exp(xᵢ yⱼ) are algebraically independent
    over ℚ.
  source_ref: Waldschmidt 1973; Brownawell 1974
