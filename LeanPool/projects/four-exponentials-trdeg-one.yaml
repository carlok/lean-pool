slug: four-exponentials-trdeg-one
title: The four exponentials theorem in transcendence degree one
summary: 'Proves the four exponentials theorem in transcendence degree one, due to Waldschmidt
  (1973) and Brownawell (1974): if λ₁₁, λ₁₂, λ₂₁, λ₂₂ are non-zero complex numbers whose
  exponentials are algebraic, with λ₁₁ λ₂₂ = λ₁₂ λ₂₁, and the field they generate has
  transcendence degree at most one over ℚ, then the rows or the columns of the matrix (λᵢⱼ) are
  linearly dependent over ℚ. Without the hypothesis on the transcendence degree this is the open
  four exponentials conjecture. Two consequences are proved with it: Schneider''s eighth problem,
  that one of e^e and e^{e²} is transcendental, and that two of the eight numbers xᵢ, yⱼ,
  exp(xᵢ yⱼ) are algebraically independent when exp(x₁ y₂) and exp(x₂ y₂) are algebraic. The
  proof is Waldschmidt''s of 1973 with the tools of his 1971 paper: Siegel''s lemma gives an
  auxiliary function Σ c(i, j, h) zⁱ e^{(j x₁ + h x₂) z} with many zeros, an extrapolation and a
  zero count for exponential polynomials show that one of its derivatives does not vanish on the
  grid, norms down to ℚ(ω) give integer polynomials that are too small at a transcendental ω, and
  Gel''fond''s transcendence criterion, in Waldschmidt''s form, makes ω algebraic.
  Hermite–Lindemann and Schwarz''s lemma with prescribed zeros are taken from Tau Ceti.'
